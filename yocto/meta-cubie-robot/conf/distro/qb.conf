# QB OS: the distro of this (unofficial, community) project for the Radxa Cubie A7S.
# Started from oe-core's defaultsetup.conf as the Yocto manual suggests, and only the
# parts of poky (Yocto's reference distro) that this project uses are copied in.

DISTRO = "qb"
DISTRO_NAME = "QB OS"
DISTRO_VERSION = "0.1"
MAINTAINER = "Vittorio Passaretti <vittoriopt@yahoo.it>"

# vendor part of the toolchain name (aarch64-qb-linux-gcc) and of the SDK
TARGET_VENDOR = "-qb"
SDK_VENDOR = "-qbsdk"
SDK_VERSION = "${DISTRO_VERSION}"
SDK_NAME = "${DISTRO}-${TCLIBC}-${SDKMACHINE}-${IMAGE_BASENAME}-${TUNE_PKGARCH}-${MACHINE}"
SDKPATHINSTALL = "/opt/${DISTRO}/${SDK_VERSION}"

# build output stays in tmp/ (default would be tmp-glibc/)
TCLIBCAPPEND = ""
LOCALCONF_VERSION = "2"

# features: oe-core's defaults plus the graphics APIs the GPU supports.
# dropped: pcmcia, 3g and nfc (no such hardware on the board) and ptest (lttng-tools-ptest
# needs lttng-modules, which doesn't build against this kernel).
# x11 stays enabled only because the closed GPU libraries link against libX11, no X server is installed.
DISTRO_FEATURES = "${DISTRO_FEATURES_DEFAULT} opengl vulkan wayland"
DISTRO_FEATURES:remove = "pcmcia 3g nfc"
# needed by meta-virtualization (docker), does nothing without that layer
DISTRO_FEATURES += "virtualization"

INIT_MANAGER = "sysvinit"
PACKAGE_CLASSES ?= "package_rpm"

DISTRO_EXTRA_RDEPENDS += "packagegroup-core-boot"

# same as poky: hardened compiler/linker flags, no static libraries, and native tools that
# don't depend on the build host's glibc (uninative)
require conf/distro/include/security_flags.inc
require conf/distro/include/no-static-libs.inc
require conf/distro/include/yocto-uninative.inc
INHERIT += "uninative"

# same as poky: reuse build results whose output didn't change (hash equivalence)
BB_SIGNATURE_HANDLER ?= "OEEquivHash"
BB_HASHSERVE ??= "auto"

# oe-core's default list without create-spdx (the SBOM generator): meta-ros recipes use a
# generic "BSD" license name that has no license text, and create-spdx fails on it
INHERIT_DISTRO = "debian devshell sstate license remove-libtool"

# gst-omx is flagged "commercial" (H.264/H.265 patents); it's what drives the board's video engines
LICENSE_FLAGS_ACCEPTED += "commercial_gstreamer1.0-omx"
