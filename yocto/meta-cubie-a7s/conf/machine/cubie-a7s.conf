#@TYPE: Machine
#@NAME: Radxa Cubie A7S
#@DESCRIPTION: Machine configuration for the Radxa Cubie A7S (Allwinner A733)

# 2x A76 + 6x A55, poky already has a tune for that
require conf/machine/include/arm/armv8-2a/tune-cortexa76-cortexa55.inc

MACHINE_FEATURES = "usbhost usbgadget wifi bluetooth alsa"

# radxa's kernel, already proven on this board (npu works too)
PREFERRED_PROVIDER_virtual/kernel = "linux-radxa"
KERNEL_IMAGETYPE = "Image"

# has to match what the kernel recipe spits out
KERNEL_DEVICETREE = "allwinner/sun60i-a733-cubie-a7s.dtb"

# vendor kernel tree needs these, machine wide cause make-mod-scripts uses it too (not CROSS_COMPILE, that breaks openssl)
export LICHEE_KERN_DIR = "./"
export BSP_TOP = "bsp/"

# radxa's u-boot fork, same one that booted the reference image
PREFERRED_PROVIDER_virtual/bootloader = "u-boot-radxa"
PREFERRED_PROVIDER_u-boot = "u-boot-radxa"
UBOOT_MACHINE = "radxa-cubie-a7s_defconfig"

# vendor uart driver calls it ttyAS0 not ttyS0
SERIAL_CONSOLES = "115200;ttyAS0"

MACHINE_ESSENTIAL_EXTRA_RDEPENDS = ""

# onboard wifi/bt (aic8800 on usb), drivers are built in linux-radxa
MACHINE_EXTRA_RRECOMMENDS += "kernel-module-aic-load-fw kernel-module-aic8800-fdrv kernel-module-aic-btusb aic8800-firmware"
# wifi country: the two-letter code of the country the board runs in (e.g. "CH"), set it in site.conf.
# it decides which channels and how much transmit power the wifi may use. the default "00" means
# "rules valid everywhere": some channels (2.4GHz 12-14, most of 5GHz) only listen and can't host an access point
CUBIE_WIFI_COUNTRY ??= "00"
MACHINE_EXTRA_RRECOMMENDS += "wireless-regdb-static"

# npu: galcore + the openvx libs it talks to
MACHINE_EXTRA_RRECOMMENDS += "kernel-module-galcore viv-unified-driver"

# video engines: cedar driver + the cedarc codec libs
MACHINE_EXTRA_RRECOMMENDS += "kernel-module-sunxi-ve libcedarc"

# cedarc is the openmax il implementation here, gst-omx uses it instead of bellagio
PREFERRED_PROVIDER_virtual/libomxil = "libcedarc"
VIRTUAL-RUNTIME_libomxil = "libcedarc"

# cooling: "passive" (bare board or heatsink) or "fan" (3-pin pwm fan on the fan header), set it in site.conf
# the header has no tach line so a fan can't be detected. thermal trips in the kernel cover both (fan from 60C, throttle at 90C)
CUBIE_COOLING ??= "passive"
MACHINE_EXTRA_RRECOMMENDS += "cubie-a7s-cooling ${@'kernel-module-pwm-fan' if d.getVar('CUBIE_COOLING') == 'fan' else ''}"

# gpu: pvrsrvkm (built in linux-radxa) + firmware and closed libs, gles/egl/gbm come from mesa-pvr
MACHINE_EXTRA_RRECOMMENDS += "kernel-module-pvrsrvkm img-bxm-umlibs"
PREFERRED_PROVIDER_virtual/mesa = "mesa-pvr"
PREFERRED_PROVIDER_virtual/egl = "mesa-pvr"
PREFERRED_PROVIDER_virtual/libgles1 = "mesa-pvr"
PREFERRED_PROVIDER_virtual/libgles2 = "mesa-pvr"
PREFERRED_PROVIDER_virtual/libgles3 = "mesa-pvr"
PREFERRED_PROVIDER_virtual/libgbm = "mesa-pvr"
PREFERRED_PROVIDER_virtual/libglx = "mesa-pvr"
PREFERRED_PROVIDER_virtual/libgl = "mesa-pvr"

# make sure u-boot gets built and deployed along with the image
EXTRA_IMAGEDEPENDS += "virtual/bootloader"
do_image_wic[depends] += "virtual/bootloader:do_deploy"

# header functions (pwm, i2c, uart, spi, i2s), set CUBIE_HEADER in site.conf, e.g. "pwm1-1 twi2 uart2"
CUBIE_HEADER ??= ""
# overlays need the board dt built with its symbols
KERNEL_DTC_FLAGS = "-@"
EXTRA_IMAGEDEPENDS += "cubie-a7s-header"
do_image_wic[depends] += "cubie-a7s-header:do_deploy"
# i2cdetect & co from core, gpiod tools and python libs only when meta-oe is in the build
MACHINE_EXTRA_RRECOMMENDS += "i2c-tools ${@bb.utils.contains('BBFILE_COLLECTIONS', 'openembedded-layer', 'packagegroup-cubie-a7s-header', '', d)}"

# uboot wants allwinner/<dtb>, root copy goes first so wic keeps fdtdir at /. both get the dt with the header overlays merged in
IMAGE_BOOT_FILES = "Image cubie-a7s-header.dtb;sun60i-a733-cubie-a7s.dtb cubie-a7s-header.dtb;allwinner/sun60i-a733-cubie-a7s.dtb"

# sd card image, layout is in wic/cubie-a7s.wks
IMAGE_FSTYPES = "wic"
WKS_FILE = "cubie-a7s.wks"
