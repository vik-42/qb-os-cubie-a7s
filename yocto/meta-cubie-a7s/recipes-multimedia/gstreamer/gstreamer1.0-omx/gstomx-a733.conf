# cedarc omx components on the a733 video engines, every hack below is needed (checked one by one)
# no omxh265dec: cedarc's libawh265 crashes on every hevc stream (its own vdecoderdemo too)
# no-disable-outport: cedarc can't disable a port before it's started
# cedarc-dmabuf-output: decoded frames go downstream as cedarc's own dmabufs, no copy
# no-component-reconfigure: reopen on a format change, cedarc drops the output headers on any port disable
# reuse-unstarted-component: cedarc crashes freeing a decoder that never decoded, keep it for the next pipeline
# video-framerate-integer: the encoders read the framerate as a plain integer, q16 breaks rate control

[omxh264dec]
type-name=GstOMXH264Dec
core-name=/usr/lib/libOmxCore.so
component-name=OMX.allwinner.video.decoder.avc
rank=257
in-port-index=0
out-port-index=1
hacks=no-disable-outport;cedarc-dmabuf-output;no-component-reconfigure;reuse-unstarted-component

