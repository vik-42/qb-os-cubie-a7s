# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# header tools only kick in when meta-oe is in bblayers, board stuff works without it
BBFILES_DYNAMIC += " \
    openembedded-layer:${LAYERDIR}/dynamic-layers/openembedded-layer/recipes-*/*/*.bb \
    openembedded-layer:${LAYERDIR}/dynamic-layers/openembedded-layer/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-cubie-a7s"
BBFILE_PATTERN_meta-cubie-a7s = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-cubie-a7s = "6"

LAYERDEPENDS_meta-cubie-a7s = "core"
LAYERSERIES_COMPAT_meta-cubie-a7s = "scarthgap"
