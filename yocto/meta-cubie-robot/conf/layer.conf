# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

# ros images and the zenoh bits only kick in when meta-ros jazzy is in bblayers
BBFILES_DYNAMIC += " \
    ros2-jazzy-layer:${LAYERDIR}/dynamic-layers/meta-ros/recipes-*/*/*.bb \
    ros2-jazzy-layer:${LAYERDIR}/dynamic-layers/meta-ros/recipes-*/*/*.bbappend \
"

# docker setup only kicks in when meta-virtualization is in bblayers
BBFILES_DYNAMIC += " \
    virtualization-layer:${LAYERDIR}/dynamic-layers/meta-virtualization/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "meta-cubie-robot"
BBFILE_PATTERN_meta-cubie-robot = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-cubie-robot = "7"

LAYERDEPENDS_meta-cubie-robot = "core meta-cubie-a7s"
LAYERSERIES_COMPAT_meta-cubie-robot = "scarthgap"
